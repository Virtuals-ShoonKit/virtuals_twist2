[project]
name = "rsl-rl"
version = "1.0.2"
description = "Fast and simple RL algorithms implemented in pytorch"
authors = [
    {name = "Nikita Rudin", email = "rudinn@ethz.ch"}
]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.6"

dependencies = [
    "torch>=1.4.0",
    "torchvision>=0.5.0",
    "numpy>=1.16.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rsl_rl"]
