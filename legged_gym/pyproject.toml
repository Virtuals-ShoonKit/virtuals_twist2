[project]
name = "legged-gym"
version = "1.0.0"
description = "Isaac Gym environments for Legged Robots"
authors = [
    {name = "Nikita Rudin", email = "rudinn@ethz.ch"}
]
license = {text = "BSD-3-Clause"}
requires-python = ">=3.6"

dependencies = [
    "rsl-rl",
    "matplotlib",
    "pymeshlab",
    "pydelatin",
    "tensorboard",
    "setuptools==59.5.0",
    "opencv-python",
    "tqdm",
    "wandb",
]

# Note: isaacgym must be installed manually from NVIDIA
# It's not available on PyPI

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["legged_gym"]
