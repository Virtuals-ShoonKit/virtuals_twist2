control_dt: 0.02

num_actions: 29

msg_type: "hg"     # "hg" or "go"
imu_type: "pelvis"    # "torso" or "pelvis"

lowcmd_topic: "rt/lowcmd"
lowstate_topic: "rt/lowstate"

joint2motor_idx: [0, 1, 2, 3, 4, 5, # left leg
                 6, 7, 8, 9, 10, 11, # right leg
                 12, 13, 14, # waist
                 15, 16, 17, 18, 19, 20, 21, # left arm
                 22, 23, 24, 25, 26, 27, 28 # right arm
                 ]

# Balanced PD gains - compromise between stable walking and motion tracking
kps: [80.0, 100.0, 100.0, 120.0, 35.0, 35.0, # left leg: hip_yaw, hip_roll, hip_pitch, knee, ankle_pitch, ankle_roll
      80.0, 100.0, 100.0, 120.0, 35.0, 35.0, # right leg: hip_yaw, hip_roll, hip_pitch, knee, ankle_pitch, ankle_roll
      150.0, 120.0, 120.0, # waist: yaw, roll, pitch
      40.0, 40.0, 40.0, 40.0, 20.0, 20.0, 20.0, # left arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
      40.0, 40.0, 40.0, 40.0, 20.0, 20.0, 20.0] # right arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw

kds: [2.0, 2.0, 2.0, 4.0, 2.0, 2.0, # left leg: hip_yaw, hip_roll, hip_pitch, knee, ankle_pitch, ankle_roll
      2.0, 2.0, 2.0, 4.0, 2.0, 2.0, # right leg: hip_yaw, hip_roll, hip_pitch, knee, ankle_pitch, ankle_roll
      4.0, 3.5, 3.5, # waist: yaw, roll, pitch
      5.0, 5.0, 5.0, 5.0, 1.0, 1.0, 1.0, # left arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
      5.0, 5.0, 5.0, 5.0, 1.0, 1.0, 1.0] # right arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw

# BFM-Zero default joint angles (less aggressive)
default_angles: [-0.1, 0.0, 0.0, 0.3, -0.2, 0.0, # left leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
                -0.1, 0.0, 0.0, 0.3, -0.2, 0.0, # right leg: hip_pitch, hip_roll, hip_yaw, knee, ankle_pitch, ankle_roll
                0, 0, 0, # waist: yaw, roll, pitch
                0, 0.4, 0, 1.2, 0.0, 0.0, 0.0, # left arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
                0, -0.4, 0, 1.2, 0.0, 0.0, 0.0] # right arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw

ang_vel_scale: 0.25
dof_pos_scale: 1.0
dof_vel_scale: 0.05
action_scale: 0.5 # Base action scale
action_rescale: 3.0 # Global multiplier (balanced - reduced from 5.0 for better stability)

# Per-joint action scales (balanced values)
# Order: left leg (6), right leg (6), waist (3), left arm (7), right arm (7) = 29 total
action_scale_per_joint: [0.5, 0.5, 0.5, 0.5, 0.25, 0.25, # left leg: hip_yaw, hip_roll, hip_pitch, knee, ankle_pitch, ankle_roll
                         0.5, 0.5, 0.5, 0.5, 0.25, 0.25, # right leg: hip_yaw, hip_roll, hip_pitch, knee, ankle_pitch, ankle_roll
                         0.5, 0.3, 0.3, # waist: yaw, roll, pitch (increased from 0.22 for better tracking)
                         0.35, 0.35, 0.35, 0.35, 0.1, 0.1, 0.1, # left arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw
                         0.35, 0.35, 0.35, 0.35, 0.1, 0.1, 0.1] # right arm: shoulder_pitch, shoulder_roll, shoulder_yaw, elbow, wrist_roll, wrist_pitch, wrist_yaw

